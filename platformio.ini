; Display CAT para Yaesu FT-817/818/857 sobre ESP32-2432S028R ("Cheap Yellow Display")

[platformio]
default_envs = cyd

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<touch_test.cpp>
; La pila Bluetooth clásico no cabe en la partición de 1,3 MB: 3 MB de app, sin OTA.
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -D USER_SETUP_LOADED=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; TFT en el bus HSPI (pines 12/13/14); el táctil usa VSPI con sus propios pines
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Variante original (un solo micro-USB): ILI9341
[env:cyd]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D ILI9341_2_DRIVER=1
    ; Esta placa (ESP32-D0WD-V3, un micro-USB) muestra los colores invertidos sin esto
    -D TFT_INVERSION_ON=1

; Pruebas sin adaptador: el CAT va por el USB de la placa (UART0) y el simulador del Mac hace de radio.
; Sin log por serie. Uso: pio run -e cyd-usbcat -t upload && python3 tools/ft8x7_sim.py /dev/cu.usbserial-XXX
[env:cyd-usbcat]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D ILI9341_2_DRIVER=1
    ; Esta placa (ESP32-D0WD-V3, un micro-USB) muestra los colores invertidos sin esto
    -D TFT_INVERSION_ON=1
    -D CAT_OVER_USB=1

; Calibración y prueba del táctil: pio run -e touchtest -t upload -t monitor
[env:touchtest]
extends = esp32_base
build_src_filter = +<touch_test.cpp>
build_flags =
    ${esp32_base.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1

; Variante "CYD2USB" (micro-USB + USB-C): ST7789 con colores invertidos
[env:cyd2usb]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1

; Tests unitarios del protocolo CAT en el ordenador: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
